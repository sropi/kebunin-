lass="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-2xl">
<!-- Brand Header Section -->
<div class="flex flex-col items-center pt-space-xl pb-space-lg text-center">
<div class="relative w-16 h-16 rounded-xl bg-surface-container-low shadow-sm flex items-center justify-center p-2 mb-space-sm overflow-hidden">
<img alt="KEBUNIN Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WL02ehTlI6PxjIRIkuZM2ibx7Zpv92Vuj_gPt2IF0l5SkjQJj6EK2bBudbklDbPldXOOCzdPX03G0T8RWmdCA1KWMdmWsiPg90mSk44qReRMgMByzg9D9UZa3i1-veQy70moL5J3VUSfEqenpj3su3UDE5uZA8uks93lC2qrXvNpwQEL0VhGXz9SEhO8rTyz-4hDpp39EXZnw4W-UfqN92mrDwEbAygpE5w47reo48"/>
</div>
<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md mb-space-xs shadow-sm">
<span class="material-symbols-outlined text-[14px]">eco</span>
<span>Pasar Tani Digital</span>
</span>
<h1 class="font-headline-md text-headline-md text-primary-container tracking-tight mb-space-2xs">
      Selamat Datang Kembali!
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Masuk untuk menikmati panen segar harian langsung dari petani lokal.
    </p>
</div>
<!-- Main Card Form -->
<div class="bg-surface-container-lowest rounded-xl shadow-md p-space-lg flex flex-col gap-space-md relative overflow-hidden">
<!-- Subtle Background Organic Decorative Glow -->
<div class="absolute -right-12 -top-12 w-32 h-32 rounded-full bg-secondary-fixed/20 blur-2xl pointer-events-none"></div>
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Input: Email / Phone -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="login-identifier">
<span>Email atau No. Handphone</span>
</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest transition-colors shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] select-none mr-2">mail</span>
<input class="w-full bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 p-0" id="login-identifier" placeholder="contoh: citra@kebunin.id" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="login-password">
<span>Kata Sandi</span>
</label>
<a class="font-label-md text-label-md text-tertiary-container hover:text-tertiary transition-colors" href="#">
            Lupa Kata Sandi?
          </a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest transition-colors shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] select-none mr-2">lock</span>
<input class="w-full bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 p-0" id="login-password" placeholder="Masukkan kata sandi" type="password"/>
<button aria-label="Lihat kata sandi" class="text-outline hover:text-primary transition-colors focus:outline-none flex items-center justify-center p-1" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 bg-primary-container hover:bg-primary active:scale-[0.99] transition-all text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-md flex items-center justify-center gap-2 mt-space-2xs" type="submit">
<span>Masuk Sekarang</span>
<span class="material-symbols-outlined text-[18px]">nest_eco_leaf</span>
</button>
</form>
<!-- Visual Divider -->
<div class="flex items-center gap-3 my-1">
<div class="h-[1px] flex-1 bg-surface-variant"></div>
<span class="font-label-md text-label-md text-outline">atau masuk dengan</span>
<div class="h-[1px] flex-1 bg-surface-variant"></div>
</div>
<!-- Google Authentication Button -->
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container text-on-surface font-label-lg text-label-lg rounded-xl shadow-sm flex items-center justify-center gap-3 active:scale-[0.99] transition-all" type="button">
<svg class="w-5 h-5 select-none" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.24v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.24C.45 8.17 0 9.94 0 12s.45 3.83 1.24 5.41l4.04-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.59l4.04 3.15c.95-2.84 3.6-4.99 6.72-4.99z" fill="#EA4335"></path>
</svg>
<span>Masuk dengan Google</span>
</button>
</div>
<!-- Reassurance / Trust Badge -->
<div class="mt-space-lg mx-auto bg-surface-container-low/80 backdrop-blur-sm rounded-full py-2 px-4 flex items-center gap-2 shadow-sm max-w-fit">
<span class="material-symbols-outlined text-secondary text-[18px]">verified</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium text-center">
      Belanja aman, sayur dipanen di hari pengiriman
    </span>
</div>
<!-- Bottom Registration Link -->
<div class="mt-space-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Belum punya akun? 
      <a class="font-label-lg text-label-lg text-primary-container font-semibold hover:underline inline-flex items-center ml-1" href="#">
        Daftar Sekarang
        <span class="material-symbols-outlined text-[16px] ml-0.5">arrow_forward</span>
</a>
</p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
